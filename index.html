<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UID Status · Masked PAN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1120 0%, #1a2332 100%);
            display: flex; align-items: center; justify-content: center; padding: 1.5rem;
        }
        .card {
            background: rgba(18, 28, 40, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 255, 255, 0.1);
            width: 100%; max-width: 680px; padding: 2.5rem 2.2rem;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }
        h1 { display: flex; align-items: center; gap: 0.8rem; font-weight: 600; font-size: 2rem; color: #e0f2fe; margin-bottom: 0.5rem; }
        h1 i { color: #2dd4bf; font-size: 2rem; filter: drop-shadow(0 0 8px rgba(45, 212, 191, 0.6)); }
        .subhead { color: #94a3b8; font-size: 1rem; margin-bottom: 2.2rem; border-left: 4px solid #2dd4bf; padding-left: 1.2rem; }
        .input-group { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
        .input-wrapper { flex: 1; min-width: 240px; position: relative; }
        .input-wrapper i { position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%); color: #2dd4bf; font-size: 1.2rem; opacity: 0.8; pointer-events: none; }
        input {
            width: 100%; padding: 1.2rem 1.2rem 1.2rem 3.2rem; background: #0f172a;
            border: 1.5px solid #1e293b; border-radius: 2rem; font-size: 1.2rem;
            font-weight: 500; color: #f1f5f9; outline: none; letter-spacing: 0.5px;
        }
        input:focus { border-color: #2dd4bf; box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.2); }
        input::placeholder { color: #475569; }
        .progress-bar { height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden; margin-bottom: 1.5rem; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #0d9488, #2dd4bf); width: 0%; transition: width 0.2s; }
        .result-container {
            background: #0b1622; border-radius: 2rem; padding: 1.8rem;
            border: 1px solid #1e2a3a; min-height: 180px; word-break: break-word;
        }
        .status-header {
            display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.5rem;
            color: #cbd5e1; font-weight: 500; font-size: 1.1rem;
            border-bottom: 1px dashed #1e2a3a; padding-bottom: 0.8rem;
        }
        .data-row { display: flex; flex-direction: column; gap: 1rem; }
        .field { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.6rem 1.2rem; }
        .field .label { min-width: 150px; color: #94a3b8; font-size: 0.95rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .field .value {
            font-size: 1.3rem; font-weight: 600; color: #f0f9ff;
            background: #0f1a27; padding: 0.3rem 1.2rem; border-radius: 3rem;
            border: 1px solid #253544; flex: 1; letter-spacing: 0.5px;
            word-break: break-word;
        }
        .value.masked-pan {
            font-family: 'Courier New', monospace; background: #0b1f1c;
            border-color: #2dd4bf; color: #a7f3d0; letter-spacing: 1.5px;
        }
        .badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.4rem 1.2rem; border-radius: 2rem; font-size: 0.9rem; font-weight: 600; }
        .badge.linked { background: #064e3b; color: #a7f3d0; border: 1px solid #2dd4bf; }
        .badge.not-linked { background: #4c1d1d; color: #fecaca; border: 1px solid #ef4444; }
        .error-message {
            background: #2a1215; border-left: 6px solid #ef4444; color: #fecaca;
            padding: 1rem 1.2rem; border-radius: 1rem; display: flex;
            align-items: center; gap: 0.8rem; font-weight: 500;
        }
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 2rem 1rem; color: #52637a; text-align: center; }
        .empty-state i { font-size: 2.8rem; opacity: 0.5; }
        .spinner {
            display: inline-block; width: 1.4rem; height: 1.4rem;
            border: 3px solid rgba(45, 212, 191, 0.2); border-top-color: #2dd4bf;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-timer { font-size: 0.85rem; color: #2dd4bf; margin-top: 0.3rem; font-weight: 600; }
        .footer-note {
            margin-top: 1.5rem; font-size: 0.8rem; color: #3b4a5e;
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid #1b2533; padding-top: 1rem;
        }
        .footer-note i { color: #2dd4bf; margin-right: 0.3rem; }
        @media (max-width: 540px) {
            .card { padding: 1.8rem 1.4rem; border-radius: 2rem; }
            h1 { font-size: 1.7rem; }
            .field .label { min-width: 100%; }
            .field .value { font-size: 1.1rem; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1><i class="fas fa-id-card"></i> UID → Masked PAN</h1>
        <div class="subhead"><i class="fas fa-bolt" style="margin-right: 0.6rem; color: #2dd4bf;"></i> 12 digit complete karte hi auto-fetch</div>

        <div class="input-group">
            <div class="input-wrapper">
                <i class="fas fa-fingerprint"></i>
                <input type="text" id="uidInput" placeholder="Enter 12-digit UID" maxlength="12" inputmode="numeric" autocomplete="off">
            </div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

        <div id="resultContainer" class="result-container">
            <div class="empty-state">
                <i class="fas fa-keyboard"></i>
                <span>Start typing UID — auto fetch at 12 digits</span>
            </div>
        </div>

        <div class="footer-note">
            <span><i class="fas fa-code"></i> API: anon-pan-info</span>
            <span><i class="fas fa-user-secret"></i> mr_anonymous_404</span>
        </div>
    </div>

    <!-- ✅ API.JS FILE LINK -->
    <script src="api.js"></script>
</body>
</html>
